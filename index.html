<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gerador ESIP Profissional</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{background:#2b0000;color:white;font-family:Arial,sans-serif;text-align:center;margin:0;padding:20px;}
.container{max-width:420px;margin:auto;background:#3a0000;padding:20px;border-radius:15px;box-shadow:0 0 12px #ff000033;}
label{display:block;text-align:left;margin-top:15px;}
input,select{width:100%;padding:10px;border-radius:6px;border:none;margin-top:5px;background:#550000;color:white;}
button{width:100%;padding:12px;background:#ff0000;color:white;border:none;border-radius:10px;font-size:18px;margin-top:18px;cursor:pointer;}
#qrcode{margin-top:20px;}
#previewLogo{max-width:100px;margin-top:8px;border-radius:6px;display:none;}
#loginBox,#adminArea{display:none;background:#1a0000;padding:20px;border-radius:12px;max-width:900px;margin:40px auto;}
table{width:100%;border-collapse:collapse;margin-top:15px;}
th,td{border:1px solid #660000;padding:6px;text-align:left;font-size:14px;}
th{background:#330000;}
.small{font-size:13px;opacity:.9;}
.header-row{display:flex;justify-content:space-between;align-items:center;max-width:900px;margin:0 auto 18px;}
.notice{margin-top:8px;color:#aaffcc;}
.admin-tools{display:flex;gap:10px;margin:15px 0;flex-wrap:wrap;}
.admin-tools input{flex:1;}
.admin-tools button{width:auto;padding:10px 14px;font-size:14px;}
</style>
</head>

<body>

<div class="header-row">
  <h2>📡 ESIP - Gerador de Ingressos</h2>
  <button onclick="mostrarLogin()">🔐 Área do Administrador</button>
</div>

<div class="container">
    <label>Nome:</label>
    <input id="nome">

    <label>Evento:</label>
    <input id="evento"
      oninput="
        this.value=this.value.toUpperCase();
        EVENTO_ATUAL=this.value;
        localStorage.setItem('eventoAtual',EVENTO_ATUAL);
      ">

    <label>Logo do Evento:</label>
    <input type="file" id="logoEvento" accept="image/*">
    <img id="previewLogo">

    <label>Portaria:</label>
    <select id="portaria">
        <option value="A">Portaria A</option>
        <option value="B">Portaria B</option>
        <option value="C">Portaria C</option>
    </select>

    <label>CPF:</label>
    <input id="cpf" maxlength="11" oninput="this.value=this.value.replace(/\D/g,'')">

    <button onclick="gerarQR()">Gerar QR</button>
    <div id="qrcode"></div>
    <button onclick="baixarPDF()">📄 Baixar PDF</button>
    <p id="status" class="notice"></p>
</div>

<div id="loginBox">
    <h3>🔐 Login do Administrador</h3>
    <input id="senhaAdmin" type="password">
    <button onclick="validarAdmin()">Entrar</button>
    <button onclick="fecharLogin()">Cancelar</button>
</div>

<div id="adminArea">
    <h2>📋 Registros</h2>
    <div class="small">Total: <span id="contadorRegistros">0</span></div>

    <div class="admin-tools">
        <input id="buscarCPF" placeholder="Buscar por CPF">
        <button onclick="buscarPorCPF()">🔍 Buscar</button>
        <button onclick="carregarRegistros()">🔄 Limpar</button>
    </div>

    <!-- Configuração de PDF (somente admin) -->
    <div class="admin-tools">
        <input id="tituloPDF" placeholder="Título do PDF (Topo)">
        <input type="file" id="logoAdminPDF" accept="image/*">
        <button onclick="salvarConfiguracoesPDF()">💾 Salvar Configurações PDF</button>
    </div>

    <button onclick="exportCSV()">📤 Exportar CSV</button>
    <button onclick="exportarPDFPortaria()">📄 Exportar PDF por Portaria</button>
    <button onclick="limparRegistros()">🗑️ Limpar Tudo</button>
    <button onclick="fecharAdmin()">🔙 Voltar</button>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Evento</th>
                <th>CPF</th>
                <th>Portaria</th>
                <th>ID</th>
                <th>Data/Hora</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="registrosTabela"></tbody>
    </table>
</div>

<script>
let ultimoID="", LOGO_EVENTO_DATAURL="", LOGO_ADMIN_DATAURL="", TITULO_PDF="";
let EVENTO_ATUAL = localStorage.getItem("eventoAtual") || "";

// Carregar configurações de título e logo
window.addEventListener("DOMContentLoaded",()=>{
    const logoSaved = localStorage.getItem("logoPDF");
    const tituloSaved = localStorage.getItem("tituloPDF");
    if(logoSaved){
        LOGO_ADMIN_DATAURL = logoSaved;
    }
    if(tituloSaved){
        TITULO_PDF = tituloSaved;
        tituloPDF.value = TITULO_PDF;
    }
    if(EVENTO_ATUAL){
        evento.value = EVENTO_ATUAL;
    }
});

// Salvar configurações do admin (logo e título)
function salvarConfiguracoesPDF(){
    TITULO_PDF = tituloPDF.value.trim();
    localStorage.setItem("tituloPDF", TITULO_PDF);
    if(LOGO_ADMIN_DATAURL) localStorage.setItem("logoPDF", LOGO_ADMIN_DATAURL);
    alert("Configurações PDF salvas!");
}

// Upload do logo PDF admin
logoAdminPDF.onchange = e=>{
    const f = e.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = ev=>{
        LOGO_ADMIN_DATAURL = ev.target.result;
    };
    r.readAsDataURL(f);
};

// Funções do administrador e geração de QR Code
function agora(){
    const d = new Date();
    return d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR");
}

function _getRegistros(){ return JSON.parse(localStorage.getItem("esipRegistros") || "[]"); }
function _setRegistros(a){ localStorage.setItem("esipRegistros", JSON.stringify(a)); }

function gerarQR(){
    const n = nome.value.trim(), e = EVENTO_ATUAL, c = cpf.value.trim(), p = portaria.value;
    if(!n || !e || c.length !== 11) return alert("Dados inválidos ou evento não definido");

    const dataHora = agora();
    ultimoID = p + "-INGR-" + Math.random().toString(36).substr(2,8).toUpperCase();

    qrcode.innerHTML = "";
    new QRCode(qrcode, { text: "ID: " + ultimoID, width: 250, height: 250 });

    let r = _getRegistros();
    r.push({ nome: n, evento: e, cpf: c, portaria: p, id: ultimoID, dataHora });
    _setRegistros(r);

    status.textContent = "QR gerado: " + ultimoID;
}

// Geração do PDF (somente na área administrativa)
function baixarPDF(){
    if(!ultimoID) return;
    const r = _getRegistros().find(x => x.id === ultimoID);
    const { jsPDF } = window.jspdf;
    const d = new jsPDF();

    // Logo do administrador
    if(LOGO_ADMIN_DATAURL) d.addImage(LOGO_ADMIN_DATAURL, "PNG", 14, 14, 40, 40);

    // Título do PDF
    if(TITULO_PDF) {
        d.setFontSize(26);
        const w = d.internal.pageSize.getWidth();
        d.text(TITULO_PDF, (w - d.getTextWidth(TITULO_PDF)) / 2, 30);

        // Quantidade de registros
        const registros = _getRegistros();
        d.setFontSize(14);
        d.text("Total de registros: " + registros.length, 14, 40);
    }

    // Conteúdo do ingresso
    let y = 55;
    d.setFontSize(16);
    const registros = _getRegistros();
    d.text("ID: " + r.id + " | Registro " + (registros.findIndex(x => x.id === r.id) + 1) + " de " + registros.length, 14, y);
    y += 12;

    d.text("Nome: " + r.nome, 14, y); y += 10;
    d.text("CPF: " + r.cpf, 14, y); y += 10;
    d.text("Portaria: " + r.portaria, 14, y); y += 10;
    d.text("Data/Hora: " + r.dataHora, 14, y); y += 14;

    // Título grande da portaria
    d.setFontSize(36);
    d.setTextColor(255, 0, 0);
    const t = "PORTARIA " + r.portaria;
    d.text(t, (d.internal.pageSize.getWidth() - d.getTextWidth(t)) / 2, y); y += 20;

    // QR Code
    const img = qrcode.querySelector("canvas").toDataURL("image/png");
    d.addImage(img, "PNG", (d.internal.pageSize.getWidth() - 120) / 2, y, 120, 120);

    const nomePDF = EVENTO_ATUAL.trim().replace(/\s+/g, "_").replace(/[^\w\-]/g, "");

    d.save(nomePDF + ".pdf");

    // Limpa o formulário para o próximo ingresso
    ultimoID = "";
    nome.value = "";
    cpf.value = "";
    portaria.value = "A";
    qrcode.innerHTML = "";
    status.textContent = "Pronto para o próximo ingresso";
}

// Resto das funções de admin (exclusão de registros, exportação)
function mostrarLogin() { loginBox.style.display = "block"; }
function fecharLogin() { loginBox.style.display = "none"; }
function validarAdmin() {
    if (senhaAdmin.value === "ADMIN2025") {
        loginBox.style.display = "none";
        adminArea.style.display = "block";
        carregarRegistros();
    } else alert("Senha incorreta");
}
function fecharAdmin() { adminArea.style.display = "none"; }

function carregarRegistros() {
    const t = registrosTabela;
    t.innerHTML = "";
    const r = _getRegistros();
    contadorRegistros.textContent = r.length;
    r.forEach((x, i) => {
        t.innerHTML += `<tr>
        <td>${x.nome}</td>
        <td>${x.evento}</td>
        <td>${x.cpf}</td>
        <td>${x.portaria}</td>
        <td>${x.id}</td>
        <td>${x.dataHora}</td>
        <td><button onclick="excluirRegistro(${i})">🗑️</button></td>
        </tr>`;
    });
}

function excluirRegistro(i) {
    if (!confirm("Excluir este registro?")) return;
    let r = _getRegistros();
    r.splice(i, 1);
    _setRegistros(r);
    carregarRegistros();
}

function buscarPorCPF() {
    const cpfBusca = buscarCPF.value.trim();
    if (!cpfBusca) return;
    const t = registrosTabela;
    t.innerHTML = "";
    const r = _getRegistros().filter(x => x.cpf.includes(cpfBusca));
    contadorRegistros.textContent = r.length;
    r.forEach((x, i) => {
        t.innerHTML += `<tr>
        <td>${x.nome}</td>
        <td>${x.evento}</td>
        <td>${x.cpf}</td>
        <td>${x.portaria}</td>
        <td>${x.id}</td>
        <td>${x.dataHora}</td>
        <td><button onclick="excluirRegistro(${i})">🗑️</button></td>
        </tr>`;
    });
}

function limparRegistros() {
    if (confirm("Apagar tudo?")) {
        localStorage.removeItem("esipRegistros");
        carregarRegistros();
    }
}

function exportCSV() {
    const registros = _getRegistros();
    if (!registros.length) {
        alert("Nenhum registro para exportar");
        return;
    }

    let csv = "Nome,Evento,CPF,Portaria,ID,Data/Hora\n";
    registros.forEach(r => {
        csv += `"${r.nome}","${r.evento}","${r.cpf}","${r.portaria}","${r.id}","${r.dataHora}"\n`;
    });

    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "registros_esip.csv";
    a.click();

    URL.revokeObjectURL(url);
}

function exportarPDFPortaria() {
    const registros = _getRegistros();
    if (!registros.length) {
        alert("Nenhum registro para exportar");
        return;
    }

    const { jsPDF } = window.jspdf;
    const portarias = ["A", "B", "C"];

    portarias.forEach(portaria => {
        const lista = registros.filter(r => r.portaria === portaria);
        if (!lista.length) return;

        const pdf = new jsPDF();
        let y = 20;

        pdf.setFontSize(18);
        pdf.text(`Relatório - Portaria ${portaria}`, 14, y);
        y += 12;

        lista.forEach(r => {
            if (y > 270) {
                pdf.addPage();
                y = 20;
            }
            pdf.setFontSize(12);
            pdf.text(
                `Nome: ${r.nome} | CPF: ${r.cpf} | ID: ${r.id} | ${r.dataHora}`,
                14,
                y
            );
            y += 8;
        });

        pdf.save(`portaria_${portaria}.pdf`);
    });
}
</script>

</body>
</html>
