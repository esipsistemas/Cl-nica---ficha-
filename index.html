<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gerador ESIP Profissional</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

<style>
body {background: #2b0000; color: white; font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 20px;}
.container {max-width: 420px; margin: auto; background: #3a0000; padding: 20px; border-radius: 15px; box-shadow: 0 0 12px #ff000033;}
label {display: block; text-align: left; margin-top: 15px;}
input, select {width: 100%; padding: 10px; border-radius: 6px; border: none; margin-top: 5px; background: #550000; color: white;}
button {width: 100%; padding: 12px; background: #ff0000; color: white; border: none; border-radius: 10px; font-size: 18px; margin-top: 18px; cursor: pointer;}
#qrcode {margin-top: 20px;}
#previewLogo {max-width: 100px; margin-top: 8px; border-radius: 6px; display: none;}
#previewLogoPDF {max-width: 80px; margin-top: 5px; display: none;}
#loginBox, #adminArea {display: none; background: #1a0000; padding: 20px; border-radius: 12px; max-width: 900px; margin: 40px auto;}
table {width: 100%; border-collapse: collapse; margin-top: 15px;}
th, td {border: 1px solid #660000; padding: 6px; text-align: left; font-size: 14px;}
th {background: #330000;}
.small {font-size: 13px; opacity: .9;}
.header-row {display: flex; justify-content: space-between; align-items: center; max-width: 900px; margin: 0 auto 18px;}
.notice {margin-top: 8px; color: #aaffcc;}
.admin-tools {display: flex; gap: 10px; margin: 15px 0; flex-wrap: wrap;}
.admin-tools input {flex: 1;}
.admin-tools button {width: auto; padding: 10px 14px; font-size: 14px;}
</style>
</head>

<body>

<div class="header-row">
<h2>📡 ESIP - Gerador de Ingressos</h2>
<button onclick="mostrarLogin()">🔐 Área do Administrador</button>
</div>

<div class="container">
<label>Nome:</label>
<input id="nome">
<label>Evento:</label>
<input id="evento" oninput="this.value=this.value.toUpperCase(); EVENTO_ATUAL=this.value; localStorage.setItem('eventoAtual', EVENTO_ATUAL);">
<label>Logo do Evento:</label>
<input type="file" id="logoEvento" accept="image/*">
<img id="previewLogo">
<label>Portaria:</label>
<select id="portaria">
<option value="A">Portaria A</option>
<option value="B">Portaria B</option>
<option value="C">Portaria C</option>
<option value="VIP">Portaria VIP</option>
<option value="DIOMAR">Portaria DIOMAR</option>
<option value="YARA RODRIGUES">Portaria YARA RODRIGUES</option>
<option value="SPE FC INCORPORADORA">Portaria SPE FC INCORPORADORA</option>
</select>
<label>CPF:</label>
<input id="cpf" maxlength="11" oninput="this.value=this.value.replace(/\D/g,'')">
<label>Localização (Google Maps):</label>
<input id="localizacao" placeholder="Ex: https://goo.gl/maps/abc123">
<p class="notice">⚠️ Sistema de Segurança ESIP</p>
<button onclick="gerarQR()">Gerar QR</button>
<div id="qrcode"></div>
<button onclick="baixarPDF()">📄 Baixar PDF</button>
<p id="status" class="notice"></p>
</div>

<div class="container" style="margin-top:20px;">
<h3>Configuração PDF Portaria</h3>
<label>Título do PDF:</label>
<input id="tituloPortaria" placeholder="Ex: RELATÓRIO DE PORTARIA">
<label>Logo para PDF:</label>
<input type="file" id="logoPDFPortaria" accept="image/*">
<img id="previewLogoPDF" style="max-width:80px; display:none; margin-top:5px;">
</div>

<div id="loginBox">
<h3>🔐 Login do Administrador</h3>
<input id="senhaAdmin" type="password">
<button onclick="validarAdmin()">Entrar</button>
<button onclick="fecharLogin()">Cancelar</button>
</div>

<div id="adminArea">
<h2>📋 Registros</h2>
<div class="small">Total: <span id="contadorRegistros">0</span></div>
<div class="admin-tools">
<input id="buscarCPF" placeholder="Buscar por CPF">
<button onclick="buscarPorCPF()">🔍 Buscar</button>
<button onclick="carregarRegistros()">🔄 Limpar</button>
</div>
<button onclick="exportCSV()">📤 Exportar CSV</button>
<button onclick="exportarPDFPortaria()">📄 Exportar PDF por Portaria</button>
<button onclick="limparRegistros()">🗑️ Limpar Tudo</button>
<button onclick="fecharAdmin()">🔙 Voltar</button>
<table>
<thead>
<tr><th>Nome</th><th>Evento</th><th>CPF</th><th>Portaria</th><th>ID</th><th>Data/Hora</th><th>Ações</th></tr>
</thead>
<tbody id="registrosTabela"></tbody>
</table>
</div>

<script>
let ultimoID="", LOGO_EVENTO_DATAURL="", LOGO_PORTARIA_DATAURL="";
let EVENTO_ATUAL = localStorage.getItem("eventoAtual") || "";
if(EVENTO_ATUAL){document.addEventListener("DOMContentLoaded",()=>{evento.value=EVENTO_ATUAL});}

function agora(){const d=new Date();return d.toLocaleDateString("pt-BR")+" "+d.toLocaleTimeString("pt-BR");}
function _getRegistros(){return JSON.parse(localStorage.getItem("esipRegistros")||"[]");}
function _setRegistros(a){localStorage.setItem("esipRegistros",JSON.stringify(a));}

function gerarQR(){
const n=nome.value.trim(),e=EVENTO_ATUAL,c=cpf.value.trim(),p=portaria.value;
if(!n||!e||c.length!==11)return alert("Dados inválidos ou evento não definido");
const dataHora=agora();
ultimoID=p+"-INGR-"+Math.random().toString(36).substr(2,8).toUpperCase();
qrcode.innerHTML="";
new QRCode(qrcode,{text:"ID: "+ultimoID,width:250,height:250});
let r=_getRegistros();
r.push({nome:n,evento:e,cpf:c,portaria:p,id:ultimoID,dataHora});
_setRegistros(r);
status.textContent="QR gerado: "+ultimoID;
}

logoEvento.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{LOGO_EVENTO_DATAURL=ev.target.result;previewLogo.src=LOGO_EVENTO_DATAURL;previewLogo.style.display="block"};r.readAsDataURL(f);};
logoPDFPortaria.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{LOGO_PORTARIA_DATAURL=ev.target.result;previewLogoPDF.src=LOGO_PORTARIA_DATAURL;previewLogoPDF.style.display="block"};r.readAsDataURL(f);};

function adicionarRodape(pdf,yRodape){
pdf.setFontSize(10);
pdf.setTextColor(120);
const textoRodape="📌 Sistema ESIP - Anti-Fraude | Todos os direitos reservados";
pdf.text(textoRodape,pdf.internal.pageSize.width/2,yRodape,{align:"center"});
}

function adicionarMarcaDagua(pdf){
if(!LOGO_EVENTO_DATAURL)return;
const w=pdf.internal.pageSize.width,h=pdf.internal.pageSize.height;
pdf.setGState(new pdf.GState({opacity:0.1}));
pdf.addImage(LOGO_EVENTO_DATAURL,"PNG",(w-100)/2,(h-100)/2,100,100);
pdf.setGState(new pdf.GState({opacity:1}));
}

// Função para adicionar o selo colorido
function adicionarSeloColorido(pdf, portaria){
let cor = [128,0,128]; // padrão Roxo

if(portaria === "A") cor = [0,128,0];          // Verde
if(portaria === "B") cor = [0,0,255];          // Azul
if(portaria === "C") cor = [255,140,0];        // Laranja
if(portaria === "VIP") cor = [128,0,128];      // Roxo
if(portaria === "FC INCORPORADORA") cor = [0,150,136]; 
if(portaria === "SPE FC INCORPORADORA") cor = [121,85,72];

pdf.setFillColor(...cor);
pdf.setDrawColor(0);
pdf.roundedRect(140, 20, 55, 20, 5, 5, 'FD');

pdf.setTextColor(255,255,255);
pdf.setFontSize(12);
pdf.text("PROTOCOLO", 167, 30, {align:"center"});
pdf.setFontSize(10);
pdf.text(portaria, 167, 37, {align:"center"});

pdf.setTextColor(0,0,0);
}

// Função para gerar código de barras
function gerarCodigoBarrasBase64(texto){
const canvas = document.createElement("canvas");
JsBarcode(canvas, texto, {
format: "CODE128",
width: 2,
height: 50,
displayValue: true,
fontSize: 14
});
return canvas.toDataURL("image/png");
}

function baixarPDF(){
if(!ultimoID)return;
const r=_getRegistros().find(x=>x.id===ultimoID);
const {jsPDF}=window.jspdf;
const d=new jsPDF();
adicionarMarcaDagua(d);
if(LOGO_EVENTO_DATAURL)d.addImage(LOGO_EVENTO_DATAURL,"PNG",14,14,40,40);
d.setFontSize(26);d.text(r.evento,LOGO_EVENTO_DATAURL?60:14,30);
let y=60;
d.setFontSize(16);d.text("Nome: "+r.nome,14,y);y+=10;
d.text("CPF: "+r.cpf,14,y);y+=10;
d.text("Portaria: "+r.portaria,14,y);y+=10;
d.text("ID: "+r.id,14,y);y+=10;
d.text("Data/Hora: "+r.dataHora,14,y);y+=14;
const local=document.getElementById("localizacao").value.trim();
if(local){d.setFontSize(16);d.setTextColor(0,0,255);d.textWithLink("Implante sua Própria Central de Segurança profissional. ACESSE AQUI.",14,y,{url:local});y+=14;}
d.setFontSize(14);d.setTextColor(255,0,0);d.text("⚠️ Sistema ESIP: VALIDAÇÃO OFICIAL Anti-fraude",14,y);y+=14;
d.setFontSize(36);d.setTextColor(75,0,130);
const w=d.internal.pageSize.getWidth(),t=""+r.portaria;
d.text(t,(w-d.getTextWidth(t))/2,y);y+=20;
adicionarSeloColorido(d, r.portaria); // Adiciona o selo colorido
const img=qrcode.querySelector("canvas").toDataURL("image/png");
d.addImage(img,"PNG",(w-120)/2,y,120,120);
y += 130;

const codigoBarras = gerarCodigoBarrasBase64(r.id); // Gera o código de barras
d.addImage(codigoBarras, "PNG", (w-160)/2, y, 160, 40);

adicionarRodape(d,d.internal.pageSize.height-10);
const nomePDF=EVENTO_ATUAL.trim().replace(/\s+/g,"_").replace(/[^\w\-]/g,"");
d.save(nomePDF+".pdf");
ultimoID="";nome.value="";cpf.value="";portaria.value="A";qrcode.innerHTML="";document.getElementById("localizacao").value="";status.textContent="Pronto para o próximo ingresso";
}

function mostrarLogin(){loginBox.style.display="block";}
function fecharLogin(){loginBox.style.display="none";}
function validarAdmin(){if(senhaAdmin.value==="ADMIN2025"){loginBox.style.display="none";adminArea.style.display="block";carregarRegistros();}else alert("Senha incorreta");}
function fecharAdmin(){adminArea.style.display="none";}

function carregarRegistros(){
const t=registrosTabela;
t.innerHTML="";
const r=_getRegistros();
contadorRegistros.textContent=r.length;
r.forEach((x,i)=>{t.innerHTML+=`<tr>
<td>${x.nome}</td>
<td>${x.evento}</td>
<td>${x.cpf}</td>
<td>${x.portaria}</td>
<td>${x.id}</td>
<td>${x.dataHora}</td>
<td><button onclick="excluirRegistro(${i})">🗑️</button></td>
</tr>`});
}

function excluirRegistro(i){if(!confirm("Excluir este registro?"))return;let r=_getRegistros();r.splice(i,1);_setRegistros(r);carregarRegistros();}
function buscarPorCPF(){const cpfBusca=buscarCPF.value.trim();if(!cpfBusca)return;const t=registrosTabela;t.innerHTML="";const r=_getRegistros().filter(x=>x.cpf.includes(cpfBusca));contadorRegistros.textContent=r.length;r.forEach((x,i)=>{t.innerHTML+=`<tr>
<td>${x.nome}</td>
<td>${x.evento}</td>
<td>${x.cpf}</td>
<td>${x.portaria}</td>
<td>${x.id}</td>
<td>${x.dataHora}</td>
<td><button onclick="excluirRegistro(${i})">🗑️</button></td>
</tr>`});}
function limparRegistros(){if(confirm("Apagar tudo?")){localStorage.removeItem("esipRegistros");carregarRegistros();}}

function exportCSV(){
const registros=_getRegistros();
if(!registros.length){alert("Nenhum registro para exportar");return;}
let csv="Nome,Evento,CPF,Portaria,ID,Data/Hora\n";
registros.forEach(r=>{csv+=`"${r.nome}","${r.evento}","${r.cpf}","${r.portaria}","${r.id}","${r.dataHora}"\n`;});
const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});const url=URL.createObjectURL(blob);
const a=document.createElement("a");a.href=url;a.download="registros_esip.csv";a.click();URL.revokeObjectURL(url);
}

function exportarPDFPortaria(){
const registros=_getRegistros();
if(!registros.length){alert("Nenhum registro para exportar");return;}
const tituloManual=document.getElementById("tituloPortaria").value.trim()||"RELATÓRIO DE PORTARIA";
const {jsPDF}=window.jspdf;
const portarias=["A","B","C","VIP","SPE FC INCORPORADORA","INCORPORADORA"];
const evento=EVENTO_ATUAL||"Evento Não Definido";
const dataAtual=new Date().toLocaleDateString("pt-BR");
const pdf=new jsPDF();
let primeiraPagina=true;
portarias.forEach(portaria=>{
const lista=registros.filter(r=>r.portaria===portaria);
if(!lista.length)return;
if(!primeiraPagina)pdf.addPage();primeiraPagina=false;
let y=20;
if(LOGO_PORTARIA_DATAURL){pdf.addImage(LOGO_PORTARIA_DATAURL,"PNG",(pdf.internal.pageSize.width-30)/2,10,30,30);y=45;}
pdf.setFontSize(18);const tituloWidth=pdf.getTextWidth(tituloManual);pdf.text(tituloManual,(pdf.internal.pageSize.width-tituloWidth)/2,y);y+=10;
pdf.setFontSize(12);pdf.text(evento,(pdf.internal.pageSize.width-pdf.getTextWidth(evento))/2,y);y+=10;pdf.text(`Data: ${dataAtual}`,14,y);y+=12;
const portariaTitle=`Portaria ${portaria}`;pdf.setFontSize(14);pdf.text(portariaTitle,(pdf.internal.pageSize.width-pdf.getTextWidth(portariaTitle))/2,y);y+=5;
pdf.setFontSize(12);pdf.text(`Total de registros: ${lista.length}`,14,y);y+=10;
pdf.setLineWidth(0.5);pdf.line(14,y,pdf.internal.pageSize.width-14,y);y+=5;
lista.forEach((r,i)=>{if(y>270){pdf.addPage();y=20;}pdf.setFontSize(11);pdf.text(`${i+1}. ${r.nome} | CPF: ${r.cpf} | ID: ${r.id} | ${r.dataHora}`,14,y);y+=8;});
adicionarRodape(pdf,pdf.internal.pageSize.height-10);
});
pdf.save(`relatorio_portarias_${evento}_${dataAtual}.pdf`);
}
</script>

</body>
</html>
